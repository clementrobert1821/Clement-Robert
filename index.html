<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonjour</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      padding: 3rem 4rem;
      border: 1px solid #e1e6ef;
      border-radius: 1.25rem;
      background: white;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 6rem); letter-spacing: -0.06em; }
  </style>
</head>
<body>
  <main>
    <h1>Bonjour&nbsp;!</h1>
  </main>
</body>
</html>
